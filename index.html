<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <link rel="icon" type="image/png" href="/fnt-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/fnt-logo.png" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <!-- Mobile friendly: users must be able to pinch-zoom (accessibility + Google mobile usability) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Prevent iOS auto-linking numbers; real phone links use explicit tel: hrefs -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0b0c0f" />

    <!--
      Primary SEO. The values below are the homepage defaults and are
      overwritten at build time from src/lib/seo.ts (STATIC_PAGES['/']) by the
      Vite plugin in vite.config.ts. For every other public URL the Netlify
      edge function (netlify/edge-functions/seo.ts) rewrites these tags per
      request, so the first HTML response is already page-specific.
    -->
    <title>Used Cars for Sale in Manchester | FNT Motor Group</title>
    <meta name="description" content="Browse quality used cars for sale at FNT Motor Group in Manchester." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://fntmotorgroup.co.uk/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FNT Motor Group" />
    <meta property="og:title" content="Used Cars for Sale in Manchester | FNT Motor Group" />
    <meta property="og:description" content="Browse quality used cars for sale at FNT Motor Group in Manchester." />
    <meta property="og:url" content="https://fntmotorgroup.co.uk/" />
    <meta property="og:image" content="https://fntmotorgroup.co.uk/fnt-logo.png" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Used Cars for Sale in Manchester | FNT Motor Group" />
    <meta name="twitter:description" content="Browse quality used cars for sale at FNT Motor Group in Manchester." />
    <meta name="twitter:image" content="https://fntmotorgroup.co.uk/fnt-logo.png" />

    <!-- Geo / local business hints -->
    <meta name="geo.region" content="GB-MAN" />
    <meta name="geo.placename" content="Manchester" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- SimplePDF Integration -->
    <script src="https://unpkg.com/@simplepdf/web-embed-pdf" companyIdentifier="qiml3vqj" defer></script>

    <!-- Site-wide AutoDealer JSON-LD (NAP) is injected here at build time from
         src/config/business.ts – do not hand-edit business details in this file. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
