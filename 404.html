<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <link rel="icon" type="image/png" href="/fnt-logo.png" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0b0c0f" />

    <!--
      Served by Netlify with a real 404 status for any URL that is not a known
      route (see netlify.toml). Values are filled in at build time from
      src/lib/seo.ts NOT_FOUND_META by the Vite plugin in vite.config.ts.
      Loads the normal app bundle so the React <NotFound /> page renders.
    -->
    <title>Page Not Found | FNT Motor Group</title>
    <meta name="description" content="The page you were looking for does not exist." />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FNT Motor Group" />
    <meta property="og:title" content="Page Not Found | FNT Motor Group" />
    <meta property="og:description" content="The page you were looking for does not exist." />
    <meta property="og:image" content="https://fntmotorgroup.co.uk/fnt-logo.png" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Page Not Found | FNT Motor Group" />
    <meta name="twitter:description" content="The page you were looking for does not exist." />
    <meta name="twitter:image" content="https://fntmotorgroup.co.uk/fnt-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
