# Netlify Configuration for FNT Motor Group

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Build environment variables
[build.environment]
  NODE_VERSION = "20"

# ============================================================================
# ROUTING
# ----------------------------------------------------------------------------
# NOTE: there is intentionally NO public/_redirects file. A `_redirects` file
# is processed before this file, and the old `/* /index.html 200` rule in it
# was swallowing /sitemap.xml (served the React shell) and made every unknown
# URL a 200 copy of the homepage.
#
# Order matters: rules are matched top to bottom.
#
# Per-URL <title>/meta/JSON-LD for the SPA routes is produced by the edge
# function netlify/edge-functions/seo.ts (see its `config.path`). Edge
# functions run BEFORE these redirect rules and call context.next() to obtain
# the shell that the rules below rewrite to.
# ============================================================================

# Dynamic sitemap (Supabase-backed; lists every available car)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Known SPA routes -> app shell (200). Keep this list in sync with the
# <Route>s in src/App.tsx.
[[redirects]]
  from = "/car/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/warranty-financing"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms-conditions"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cookie-policy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Everything else that is not a real file -> real 404 (dist/404.html boots the
# app, which renders <NotFound />). Existing static assets are never shadowed
# because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Function settings (node bundler applies to all functions)
[functions]
  node_bundler = "esbuild"

# ============================================================================
# SCHEDULED SYNC DISABLED
# ============================================================================
# AutoTrader confirmed webhooks are working perfectly with 200 responses.
# The scheduled sync was causing 2-3 rapid API GET calls due to pagination
# (page 1, page 2, page 3 for ~200-250 vehicles at 100 per page).
# Per AutoTrader: max 3 API polls/day total — pagination counts as separate calls.
# 
# Solution: Rely 100% on real-time webhooks. No scheduled sync needed.
# Manual sync is still available via admin dashboard (trigger-sync function).
# ============================================================================
#
# [functions."sync-stock"]
#   schedule = "0 2 * * *"  # DISABLED - webhooks handle all updates

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Staff-only area: belt-and-braces noindex on top of robots.txt Disallow
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Headers for Netlify Functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Autotrader-Signature"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Environment-specific settings
[context.production]
  [context.production.environment]
    AUTOTRADER_ENVIRONMENT = "production"

[context.deploy-preview]
  [context.deploy-preview.environment]
    AUTOTRADER_ENVIRONMENT = "sandbox"

[context.branch-deploy]
  [context.branch-deploy.environment]
    AUTOTRADER_ENVIRONMENT = "sandbox"
